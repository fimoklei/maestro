name: apm canary

# The four real-apm canaries (`MAESTRO_REAL_APM=1`), off the pull-request gate:
# they need network and auth, and `ci.yml` must stay under its 5-minute budget.
#
# apm is pinned to 0.26.0 — the version in the header of `docs/apm-behavior.md`.
# A red run therefore means apm drifted from what that document describes; run
# `docs/agents/apm-upgrade.md` before trusting either again.
#
# Auth: the canaries call `gh auth token`, which on a runner reads `GH_TOKEN`.
# That is the only mapping — the PAT is never injected into apm's own
# environment (`.claude/rules/security.md`), so the plain canary, which reaches
# apm through `ApmCliDriver`, runs unauthenticated and fails on auth until apm
# is given a token it reads for itself. `GH_TOKEN` comes from the Actions
# secret `APM_CANARY_PAT`, a fine-grained PAT with read access to the private
# `fimoklei/agent-harness` repository. Only the repository owner can create it;
# without it every run is red on auth. It is set on the canary step alone, so
# it is not live during dependency installation.
#
# Who reads a failure: GitHub emails this workflow's last committer when a
# scheduled run fails. GitHub also disables the schedule after 60 days without
# repository activity.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    env:
      MAESTRO_REAL_APM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Install apm
        run: pipx install apm-cli==0.26.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run the apm canaries
        env:
          GH_TOKEN: ${{ secrets.APM_CANARY_PAT }}
        run: bash scripts/run-apm-canary.sh
