name: CI

# The only enforced gate (no local git hooks): lint, typecheck, build and
# build-storybook in one job, the test lanes in parallel jobs beside it.
# Runs on every pull request, so the required `verify` check always reports.
# No push trigger: every merge reaches main through a pull request.
on:
  pull_request:

permissions:
  contents: read

# A new push supersedes the run it interrupts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Smoke test that the component catalogue assembles (ADR-0008). Catches
      # broken imports/config; a runtime render crash needs the deferred
      # browser lane (story-as-test).
      - name: Build Storybook
        run: pnpm --filter @maestro/web build-storybook

  # The web lane is the largest, so it runs as two shards.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web 1/2
            args: --project web --shard 1/2
          - name: web 2/2
            args: --project web --shard 2/2
          - name: git
            args: --project git
          - name: core + integration
            args: --project core --project integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Test
        run: pnpm test ${{ matrix.args }}

  # The required check. A required check that is skipped counts as passed, so
  # this job always runs and fails unless every job it needs succeeded.
  verify:
    needs: [checks, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
