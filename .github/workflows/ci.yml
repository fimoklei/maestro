name: CI

# The only enforced gate (no local git hooks): install -> lint -> typecheck -> test -> build -> build-storybook.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Locate the pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fail the build on known high/critical advisories across runtime and dev
      # deps (reads the pnpm lockfile). Moderate/low do not fail here — they are
      # handled out of band.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Smoke test that the component catalogue assembles (ADR-0008). Catches
      # broken imports/config; a runtime render crash needs the deferred
      # browser lane (story-as-test).
      - name: Build Storybook
        run: pnpm --filter @maestro/web build-storybook
