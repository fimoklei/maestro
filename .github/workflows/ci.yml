name: CI

# The only enforced gate (no local git hooks): install -> lint -> typecheck -> test -> build -> build-storybook.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Smoke test that the component catalogue assembles (ADR-0008). Catches
      # broken imports/config; a runtime render crash needs the deferred
      # browser lane (story-as-test).
      - name: Build Storybook
        run: pnpm --filter @maestro/web build-storybook
