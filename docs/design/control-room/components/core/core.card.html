<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { padding: 18px 20px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .lbl { width: 76px; flex-shrink: 0; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../ds-loader.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
loadDS([
  "../core/Button.jsx",
  "../core/Chip.jsx",
  "../core/TypeTag.jsx",
  "../core/StatusDot.jsx",
]).then((DS) => {
  const { Button, Chip, TypeTag, StatusDot } = DS;
  function Specimen() {
    return (
      <div>
        <div className="row">
          <span className="m-label lbl">button</span>
          <Button variant="primary">+ new primitive</Button>
          <Button variant="success">deploy bundle →</Button>
          <Button variant="ghost">deploy →</Button>
          <Button variant="quiet">cancel</Button>
          <Button variant="dashed">+ register repo</Button>
          <Button variant="primary" size="sm">update</Button>
        </div>
        <div className="row">
          <span className="m-label lbl">chip</span>
          <Chip tone="ok">● in sync</Chip>
          <Chip tone="ok">● server healthy</Chip>
          <Chip tone="drift">▲ 3 drift detected</Chip>
          <Chip>v1.4.0</Chip>
          <Chip>3 items</Chip>
        </div>
        <div className="row">
          <span className="m-label lbl">typetag</span>
          <TypeTag type="skill" />
          <TypeTag type="hook" />
          <TypeTag type="mcp" />
          <TypeTag type="bundle" />
        </div>
        <div className="row" style={{ marginBottom: 0 }}>
          <span className="m-label lbl">statusdot</span>
          <StatusDot status="ok" />
          <span style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--text-3)" }}>Claude Code</span>
          <StatusDot status="drift" style={{ marginLeft: 14 }} />
          <span style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--text-muted)" }}>~/dev/acme-web</span>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Specimen />);
});
</script>
