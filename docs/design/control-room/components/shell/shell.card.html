<!-- @dsCard group="Components" viewport="700x360" name="Shell — Card · SectionHeader · NavItem · Logo" subtitle="Panels with drift outlines, section headers, sidebar nav, brand mark" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { padding: 18px 20px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../ds-loader.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
loadDS([
  "../core/Button.jsx",
  "../core/Chip.jsx",
  "../core/TypeTag.jsx",
  "../core/StatusDot.jsx",
  "../shell/Card.jsx",
  "../shell/SectionHeader.jsx",
  "../shell/NavItem.jsx",
  "../shell/Logo.jsx",
]).then((DS) => {
  const { Button, Chip, Card, SectionHeader, NavItem, Logo } = DS;
  function Row({ name, version, drift }) {
    return (
      <div style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 10, alignItems: "center", padding: "5px 14px" }}>
        <span style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--text-2)" }}>{name}</span>
        <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: drift ? "var(--amber-ink)" : "var(--green-ink)" }}>{version}</span>
      </div>
    );
  }
  function Specimen() {
    return (
      <div style={{ display: "grid", gridTemplateColumns: "180px 1fr", gap: 20 }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
          <Logo size={26} wordmark style={{ margin: "2px 0 10px 2px" }} />
          <NavItem icon="▤" label="Inventory" active />
          <NavItem icon="⇶" label="Deploy-state" />
          <NavItem icon="⧉" label="Compose" />
        </div>
        <div>
          <SectionHeader title="Deploy-state" meta="read from lockfiles · 2 targets">
            <Button variant="primary">+ new primitive</Button>
          </SectionHeader>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <Card title="Claude Code" kind="global" status={<Chip tone="ok">● in sync</Chip>}>
              <div style={{ padding: "6px 0" }}>
                <Row name="commit-style" version="2.1.0" />
                <Row name="github-mcp" version="3.2.0" />
              </div>
            </Card>
            <Card title="~/dev/acme-web" kind="local" drift status={<Chip tone="drift">▲ 1 drift</Chip>}>
              <div style={{ padding: "6px 0" }}>
                <Row name="react-patterns" version="1.0.0 → 1.2.0" drift />
                <Row name="code-review" version="1.4.0" />
              </div>
            </Card>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Specimen />);
});
</script>
</body>
</html>
