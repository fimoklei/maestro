<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces — light" subtitle="Same five steps, inverted: grey canvas → white cards. Hierarchy by lightness + 1px borders, never shadow" -->
<!DOCTYPE html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; background: var(--bg-0); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sw { border: 1px solid var(--border-strong); border-radius: var(--radius-card); height: 72px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); margin-top: 6px; line-height: 1.6; }
  .name { color: var(--text-3); }
</style>
</head>
<body>
<div class="grid">
  <div><div class="sw" style="background: var(--bg-0);"></div><div class="meta"><span class="name">--bg-0</span><br>#eceef2 · app</div></div>
  <div><div class="sw" style="background: var(--bg-1);"></div><div class="meta"><span class="name">--bg-1</span><br>#f5f7f9 · chrome</div></div>
  <div><div class="sw" style="background: var(--surface-card);"></div><div class="meta"><span class="name">--surface-card</span><br>#ffffff · cards</div></div>
  <div><div class="sw" style="background: var(--surface-inset);"></div><div class="meta"><span class="name">--surface-inset</span><br>#f3f5f8 · nested</div></div>
  <div><div class="sw" style="background: var(--surface-active);"></div><div class="meta"><span class="name">--surface-active</span><br>#e6ebf1 · active</div></div>
</div>
</body>
</html>
