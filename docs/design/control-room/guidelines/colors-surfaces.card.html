<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Five background steps — hierarchy by lightness, never by shadow" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sw { border: 1px solid var(--border-strong); border-radius: var(--radius-card); height: 72px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); margin-top: 6px; line-height: 1.6; }
  .name { color: var(--text-3); }
</style>
</head>
<body>
<div class="grid">
  <div><div class="sw" style="background: var(--bg-0);"></div><div class="meta"><span class="name">--bg-0</span><br>#0b0d10 · app</div></div>
  <div><div class="sw" style="background: var(--bg-1);"></div><div class="meta"><span class="name">--bg-1</span><br>#0d1014 · chrome</div></div>
  <div><div class="sw" style="background: var(--surface-card);"></div><div class="meta"><span class="name">--surface-card</span><br>#0f1318 · cards</div></div>
  <div><div class="sw" style="background: var(--surface-inset);"></div><div class="meta"><span class="name">--surface-inset</span><br>#11161c · nested</div></div>
  <div><div class="sw" style="background: var(--surface-active);"></div><div class="meta"><span class="name">--surface-active</span><br>#171d24 · active</div></div>
</div>
</body>
</html>
