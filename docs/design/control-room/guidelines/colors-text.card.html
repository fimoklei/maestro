<!-- @dsCard group="Colors" viewport="700x170" name="Text ramp" subtitle="Five steps from primary to micro-label dim" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 18px 20px; }
  .row { display: grid; grid-template-columns: 110px 1fr 90px; gap: 14px; align-items: baseline; padding: 5px 0; }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); text-align: right; }
  .sample { font-size: 13.5px; }
</style>
</head>
<body>
<div class="row"><span class="tok">--text-1</span><span class="sample" style="color: var(--text-1);">Primary — titles, primitive names, active nav</span><span class="hex">#e6e9ed</span></div>
<div class="row"><span class="tok">--text-2</span><span class="sample" style="color: var(--text-2);">Secondary — data rows inside cards</span><span class="hex">#c3cad2</span></div>
<div class="row"><span class="tok">--text-3</span><span class="sample" style="color: var(--text-3);">Tertiary — sidebar target names</span><span class="hex">#aeb6bf</span></div>
<div class="row"><span class="tok">--text-muted</span><span class="sample" style="color: var(--text-muted);">Muted — descriptions, inactive nav</span><span class="hex">#8a94a0</span></div>
<div class="row"><span class="tok">--text-dim</span><span class="sample" style="color: var(--text-dim);">Dim — meta, timestamps, micro-labels</span><span class="hex">#5a6470</span></div>
</body>
</html>
