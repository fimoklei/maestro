<!-- @dsCard group="Colors" viewport="700x140" name="Primitive type colors" subtitle="Fixed vocabulary: skill blue · hook purple · mcp teal · bundle amber" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 18px 20px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .cell { border: 1px solid var(--border-strong); border-radius: var(--radius-card); background: var(--surface-card); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: var(--ls-tag); text-transform: uppercase; padding: 2px 6px; border-radius: var(--radius-tag); align-self: flex-start; }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); }
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><span class="tag" style="color: var(--type-skill); border: 1px solid color-mix(in srgb, var(--type-skill) 27%, transparent); background: color-mix(in srgb, var(--type-skill) 8%, transparent);">skill</span><span class="hex">--type-skill #7aa5d8</span></div>
  <div class="cell"><span class="tag" style="color: var(--type-hook); border: 1px solid color-mix(in srgb, var(--type-hook) 27%, transparent); background: color-mix(in srgb, var(--type-hook) 8%, transparent);">hook</span><span class="hex">--type-hook #b48ad6</span></div>
  <div class="cell"><span class="tag" style="color: var(--type-mcp); border: 1px solid color-mix(in srgb, var(--type-mcp) 27%, transparent); background: color-mix(in srgb, var(--type-mcp) 8%, transparent);">mcp</span><span class="hex">--type-mcp #5fbfb0</span></div>
  <div class="cell"><span class="tag" style="color: var(--type-bundle); border: 1px solid color-mix(in srgb, var(--type-bundle) 27%, transparent); background: color-mix(in srgb, var(--type-bundle) 8%, transparent);">bundle</span><span class="hex">--type-bundle #e8a33d</span></div>
</div>
</body>
</html>
