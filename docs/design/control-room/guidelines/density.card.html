<!-- @dsCard group="Spacing" viewport="700x180" name="Density & card anatomy" subtitle="14px card padding, 9px rows, 12px grid gaps — cockpit density" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 18px 20px; display: grid; grid-template-columns: 1fr 200px; gap: 20px; align-items: start; }
  .card { background: var(--surface-card); border: 1px solid var(--border-strong); border-radius: var(--radius-card); overflow: hidden; }
  .hdr { display: flex; align-items: center; gap: 10px; padding: var(--pad-header-y) var(--pad-card-x); border-bottom: 1px solid var(--border-row); font-family: var(--font-mono); font-size: 13px; }
  .row { display: flex; justify-content: space-between; padding: var(--pad-row-y) var(--pad-card-x); border-bottom: 1px solid var(--border-row); font-family: var(--font-mono); font-size: 12px; color: var(--text-2); }
  .row:last-child { border-bottom: none; }
  .v { color: var(--green); font-size: 11px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); line-height: 2; }
</style>
</head>
<body>
<div class="card">
  <div class="hdr"><span class="m-label" style="color: var(--type-skill);">global</span>Claude Code</div>
  <div class="row"><span>commit-style</span><span class="v">2.1.0</span></div>
  <div class="row"><span>code-review</span><span class="v">1.4.0</span></div>
</div>
<div class="meta">
  --pad-card-x: 14px<br>
  --pad-header-y: 10px<br>
  --pad-row-y: 9px<br>
  grid gap: 12px<br>
  section gap: 24px
</div>
</body>
</html>
