<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px 20px; display: flex; align-items: center; gap: 40px; }
  .tile { background: var(--amber); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-mono); font-weight: 700; }
  .lockup { display: flex; align-items: center; gap: 14px; }
  .word { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
  .ctx { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
</style>
</head>
<body>
<div class="tile" style="width: 64px; height: 64px; border-radius: 12px; font-size: 34px;">M</div>
<div class="lockup">
  <div class="tile" style="width: 26px; height: 26px; border-radius: 5px; font-size: 14px;">M</div>
  <span class="word">Maestro</span>
  <span class="ctx">agent-harness · main · 9 primitives</span>
</div>
</body>
</html>
