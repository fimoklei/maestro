<!-- @dsCard group="Colors" viewport="700x196" name="Theme — dark / light" subtitle="One token set, two themes. The app toggles via [data-theme] on <html>" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; background: #07090c; }
  .panel { border: 1px solid var(--border-strong); border-radius: var(--radius-card); background: var(--bg-0); padding: 13px 14px; display: flex; flex-direction: column; gap: 11px; }
  .top { display: flex; align-items: center; gap: 9px; }
  .m { width: 22px; height: 22px; border-radius: 5px; background: var(--amber); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-mono); font-weight: 700; font-size: 12px; }
  .name { font-family: var(--font-ui); font-size: 13px; font-weight: 600; color: var(--text-1); }
  .scope { margin-left: auto; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); }
  .card { background: var(--surface-card); border: 1px solid var(--border-strong); border-radius: var(--radius-control); padding: 9px 11px; display: flex; align-items: center; gap: 9px; }
  .data { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-2); }
  .chips { margin-left: auto; display: flex; gap: 6px; }
  .chip { font-family: var(--font-mono); font-size: 10px; padding: 2px 7px; border-radius: var(--radius-tag); white-space: nowrap; }
  .drift { color: var(--amber-ink); background: var(--amber-bg); border: 1px solid var(--amber-border); }
  .sync { color: var(--green-ink); background: var(--green-bg); border: 1px solid var(--green-border); }
</style>
</head>
<body>
  <div class="panel" data-theme="dark">
    <div class="top"><span class="m">M</span><span class="name">Maestro</span><span class="scope">data-theme="dark"</span></div>
    <div class="card"><span class="data">code-review 1.2.0</span><span class="chips"><span class="chip drift">▲ drift</span></span></div>
    <div class="card"><span class="data">react-patterns 1.4.0</span><span class="chips"><span class="chip sync">● in sync</span></span></div>
  </div>
  <div class="panel" data-theme="light">
    <div class="top"><span class="m">M</span><span class="name">Maestro</span><span class="scope">data-theme="light"</span></div>
    <div class="card"><span class="data">code-review 1.2.0</span><span class="chips"><span class="chip drift">▲ drift</span></span></div>
    <div class="card"><span class="data">react-patterns 1.4.0</span><span class="chips"><span class="chip sync">● in sync</span></span></div>
  </div>
</body>
</html>
