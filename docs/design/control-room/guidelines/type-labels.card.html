<!-- @dsCard group="Type" viewport="700x130" name="Micro-labels" subtitle="10px uppercase mono with .12em tracking — section markers everywhere" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .demo { display: flex; gap: 28px; }
  .note { font-size: 12.5px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="demo">
  <span class="m-label">Targets</span>
  <span class="m-label">Deploy to</span>
  <span class="m-label">Recent activity</span>
  <span class="m-label" style="color: var(--type-skill);">global</span>
  <span class="m-label" style="color: var(--text-muted);">local</span>
</div>
<p class="note">Used as column markers and group headers in sidebars and panels. Always <span class="m-mono" style="font-size: 11px;">.m-label</span>: 10px, uppercase, 0.12em tracking, dim — colored only for the global/local target kind.</p>
</body>
</html>
