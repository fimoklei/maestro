<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 18px 20px; }
  .row { display: grid; grid-template-columns: 170px 1fr; gap: 16px; align-items: baseline; padding: 6px 0; }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); }
</style>
</head>
<body>
<div class="row"><span class="tok">--fs-title · 16/600</span><span style="font-size: var(--fs-title); font-weight: 600;">Central inventory</span></div>
<div class="row"><span class="tok">--fs-subtitle · 14/600</span><span style="font-size: var(--fs-subtitle); font-weight: 600;">Compose bundle</span></div>
<div class="row"><span class="tok">--fs-body · 13.5/400</span><span style="font-size: var(--fs-body); color: var(--text-muted);">Deploy-state — what is deployed right now, and where</span></div>
<div class="row"><span class="tok">--fs-desc · 12.5/400</span><span style="font-size: var(--fs-desc); color: var(--text-muted);">Structured review checklist with severity tiers</span></div>
</body>
</html>
