name: Measure Windows chooser (one-off, #1044)

on:
  push:
    branches: [chore/measure-windows-chooser]

jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Windows and PowerShell versions
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.VersionString
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -Command '$PSVersionTable.PSVersion.ToString(); [System.Environment]::Version.ToString()'
      - name: Measure
        run: node docs/research/1044-windows-folder-chooser/measure.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chooser-shots
          path: shots/
