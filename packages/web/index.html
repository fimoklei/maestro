<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maestro</title>
    <!-- The theme is stamped on <html> before first paint, so the wrong theme
         never flashes (ADR-0033 §5). Mirrors resolveTheme in
         src/settings/interface-theme.ts; its test runs this script. -->
    <script>
      (() => {
        var stored = null;
        try {
          stored = localStorage.getItem("maestro.interface-theme");
        } catch (blocked) {}
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
