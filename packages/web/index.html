<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maestro</title>
    <!-- The theme is stamped on <html> before first paint, so the wrong theme
         never flashes (ADR-0033 §5). The token layer sets color-scheme on the
         same selectors, so native controls follow. Pinned to dark until the
         Interface theme row ships; that job reads localStorage and
         prefers-color-scheme here instead of the constant. -->
    <script>
      document.documentElement.setAttribute("data-theme", "dark");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
