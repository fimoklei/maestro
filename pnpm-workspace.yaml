packages:
  - "packages/*"
allowBuilds:
  esbuild: true
# A failed optional-dependency download leaves install green and the missing
# binary to crash a later step, so ride out a slow registry instead.
fetchRetries: 5
fetchRetryMaxtimeout: 120000
# Force patched versions of transitively-pulled deps with high-severity advisories.
# Each key targets only the vulnerable range, so an already-safe major is untouched;
# each replacement caps its own major, because an open range drags in the next one.
overrides:
  "form-data@>=4.0.0 <4.0.6": "^4.0.6"
  "brace-expansion@>=3.0.0 <5.0.8": "^5.0.8"
  "shell-quote@<=1.8.4": "^1.8.5"
  "nanoid@<3.3.17": "^3.3.18"
  # nwsapi is jsdom's selector engine. 2.2.26 rewrote it and every Testing
  # Library query against an open Radix menu hangs until the test times out;
  # 2.2.25 is the last release that passes. Drop this once a later release does.
  "nwsapi@>2.2.25": "2.2.25"
